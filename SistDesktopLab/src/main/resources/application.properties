spring.application.name=bd
# ? Conexão com MySQL ?
spring.datasource.url=\
    jdbc:mysql://localhost:3306/laboratorio_das_artes?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
# spring.datasource.password=@SenhaRaiz2026_*

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ? JPA / Hibernate ?
spring.jpa.database-platform=\
    org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate\
    .format_sql=true

# Executa schema.sql depois que o Hibernate criar/atualizar as tabelas.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ? Servidor ?
server.port=8080
